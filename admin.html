<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBECITY — Панель управления APK</title>
    <style>
        :root {
            --bg-main: #230224;
            --bg-card: rgba(58, 12, 54, 0.85);
            --accent-pink: #ff007f;
            --text-main: #FFFFFF;
            --text-secondary: #f5d6f0;
            --border-color: rgba(255, 0, 127, 0.55);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 15%, rgba(190, 15, 110, 0.65) 0%, transparent 60%), linear-gradient(180deg, #320536 0%, #17011d 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.5);
            text-align: center;
        }
        h1 { font-size: 20px; color: var(--accent-pink); margin-bottom: 20px; }
        .admin-input {
            width: 100%;
            background: rgba(30, 2, 32, 0.9);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }
        .admin-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; display: block; text-align: left; }
        
        .file-upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .file-upload-zone:hover {
            border-color: var(--accent-pink);
            background: rgba(255, 0, 127, 0.1);
        }
        .file-upload-zone input {
            display: none;
        }

        .btn-neon {
            background: linear-gradient(180deg, #b5157c 0%, #4a0539 50%, #8f0c62 100%);
            border: 2px solid var(--accent-pink);
            color: #fff;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            margin-top: 10px;
        }
        .btn-neon:active { transform: scale(0.98); }
        .status-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="admin-card" id="login-box">
        <h1>ВХОД В АДМИНКУ</h1>
        <label class="admin-label">Пароль администратора:</label>
        <input type="password" id="admin-pass" class="admin-input" placeholder="Введите пароль">
        <button class="btn-neon" onclick="checkPassword()">ВОЙТИ</button>
    </div>

    <div class="admin-card" id="panel-box" style="display: none;">
        <h1>ЗАГРУЗКА APK С УСТРОЙСТВА</h1>
        
        <label class="admin-label">Выберите файл с телефона или ПК:</label>
        <div class="file-upload-zone" onclick="document.getElementById('apk-file-input').click()">
            <span id="upload-label-text" style="font-size: 14px; color: #fff; font-weight: 600;">📁 Нажмите, чтобы выбрать файл</span>
            <!-- Убрали жесткий фильтр accept, теперь любые файлы активны и кликабельны -->
            <input type="file" id="apk-file-input" onchange="handleFileSelect(event)">
        </div>

        <label class="admin-label">Название файла для скачивания:</label>
        <input type="text" id="apk-name-input" class="admin-input" placeholder="VibeCity.apk">

        <label class="admin-label">Текст на кнопке загрузки:</label>
        <input type="text" id="text-input" class="admin-input" placeholder="СКАЧАТЬ APK ФАЙЛ">

        <button class="btn-neon" onclick="saveAndUploadApk()">ЗАГРУЗИТЬ И ОБНОВИТЬ СУПЕР-МОМЕНТАЛЬНО</button>

        <div class="status-box">
            Текущий активный файл: <br><strong id="current-file" style="color: #fff;">-</strong>
        </div>
        
        <button class="btn-neon" style="background: rgba(100,0,0,0.5); border-color: red; margin-top: 20px;" onclick="logout()">ВЫЙТИ</button>
    </div>

    <script>
        const CORRECT_PASS = "12345"; // Пароль администратора
        let selectedFileBase64 = null;
        let selectedFileName = "";

        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === CORRECT_PASS) {
                localStorage.setItem('vibec_admin_auth', 'true');
                showPanel();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showPanel() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('panel-box').style.display = 'block';
            loadData();
        }

        function loadData() {
            const currentName = localStorage.getItem('vibecity_custom_apk_name') || 'VibeCity.apk';
            const text = localStorage.getItem('vibecity_custom_text') || 'СКАЧАТЬ APK ФАЙЛ';
            document.getElementById('apk-name-input').value = currentName;
            document.getElementById('text-input').value = text;
            document.getElementById('current-file').textContent = currentName;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFileName = file.name;
            document.getElementById('apk-name-input').value = file.name;
            document.getElementById('upload-label-text').textContent = "✅ Выбран: " + file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveAndUploadApk() {
            const customName = document.getElementById('apk-name-input').value.trim() || 'VibeCity.apk';
            const text = document.getElementById('text-input').value.trim() || 'СКАЧАТЬ APK ФАЙЛ';

            localStorage.setItem('vibecity_custom_text', text);
            localStorage.setItem('vibecity_custom_apk_name', customName);

            if (selectedFileBase64) {
                localStorage.setItem('vibecity_custom_apk_data', selectedFileBase64);
            }

            document.getElementById('current-file').textContent = customName;
            alert("APK файл успешно загружен и применен на основном сайте!");
        }

        function logout() {
            localStorage.removeItem('vibec_admin_auth');
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('panel-box').style.display = 'none';
            document.getElementById('admin-pass').value = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('vibec_admin_auth') === 'true') {
                showPanel();
            }
        });
    </script>
</body>
</html>
